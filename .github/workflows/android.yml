name: Android starter
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify runner-provided SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - name: Storage transaction and permission policy checks
        working-directory: android
        run: |
          bash scripts/test-core.sh
          python3 scripts/check-storage-policy.py
      - name: Compile SDK-free APK and lint
        working-directory: android
        run: ./gradlew --no-daemon :storage-core:check :app:assembleDebug :app:lintDebug
