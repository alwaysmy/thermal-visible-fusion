plugins { id 'java-library' }
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
// A dependency-free executable test suite; also runs with scripts/test-core.sh.
tasks.register('verifyStorage', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.thermalfusion.storage.StorageCoreTest'
}
tasks.named('check') { dependsOn verifyStorage }
tasks.register('verifyPreview', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.thermalfusion.preview.PreviewCoreTest'
}
tasks.named('check') { dependsOn verifyPreview }
tasks.register('verifyDualPreview', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.thermalfusion.preview.DualPreviewCoreTest'
}
tasks.named('check') { dependsOn verifyDualPreview }
tasks.register('verifyCameraYuv', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.thermalfusion.camera.Yuv420ConverterTest'
}
tasks.named('check') { dependsOn verifyCameraYuv }
