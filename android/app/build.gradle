plugins { id 'com.android.application' }

android {
    namespace 'org.thermalfusion.app'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'org.thermalfusion.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0-test-pattern'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}

dependencies { implementation project(':storage-core') }
