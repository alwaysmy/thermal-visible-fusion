[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal-visible-reference"
version = "0.1.0"
description = "SDK-neutral fixed-plane thermal-visible calibration reference; not an Android application"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.3", "opencv-python-headless==4.13.0.92"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["thermal_fusion*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
